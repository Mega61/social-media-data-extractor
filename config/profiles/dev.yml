# Profile: software development / tooling reels.
#
# The point of this profile is NOT the advice in the reel — it is the sources the
# reel points at. A dev reel that mentions a repo is worthless in six months
# unless the note carries a link that still resolves.
#
# Read the `references` rules in `prompt` before editing them. The model is
# deliberately forbidden from producing URLs it did not literally see: a plausible
# fabricated github.com path is worse than no link at all, because it looks
# authoritative. Turning names into verified URLs is `src/sme/resolver.py`'s job.
name: dev
label: Software development & tooling
version: 1
prompt_version: 1

when: >
  Software development, programming, design engineering, developer tooling, AI
  coding assistants, infrastructure or computer setup. The subject is how to
  build, run or ship software.

blocks: [entities, references]

tags:
  - name: frontend
    when: UI in the browser. CSS, layout, animation, components, design-to-code, browser APIs.
  - name: backend
    when: Server-side. APIs, auth, queues, caching, server frameworks, architecture.
  - name: data
    when: Databases, schemas, queries, pipelines, model training, notebooks.
  - name: ai-tooling
    when: Building with or coding via LLMs. Agents, prompts, MCP, AI coding assistants.
  - name: devops
    when: Shipping and running it. Deploys, hosting, containers, CI, observability.
  - name: perf
    when: Making it faster or smaller. Bundle size, rendering, queries, benchmarks.
  - name: security
    when: Vulnerabilities, secrets handling, auth hardening, supply chain.
  - name: ide-workflow
    when: The local machine. Editor, terminal, shell, dotfiles, keybindings, git workflow.
  - name: repo-drop
    when: The reel exists mainly to point at a repo, library, dataset or site. Combine with a topic tag.
  - name: career
    when: Developer careers. Interviews, hiring, portfolios, freelancing, salaries.
  - name: low-signal
    when: Nothing usable. Pure engagement bait, an ad for a course, or unintelligible.
  - name: inbox
    when: Genuinely useful but fits none of the above. Needs a human to file it.

prompt: |
  You are extracting durable, searchable knowledge from a short-form social video (an
  Instagram reel) about software development, so it can be referenced months from now
  without rewatching it.

  The most valuable thing in a reel like this is usually WHAT IT POINTS AT — a repo, a
  library, a docs page, a tool, a dataset, a font, a person. Capturing those accurately
  matters more than summarising the advice.

  Return JSON matching the provided schema. Rules:

  1. TRANSCRIPT is verbatim. Transcribe what is actually said, including filler, in the
  original language. Do not translate, summarise, clean up or paraphrase it. If there is
  no speech, return an empty string.

  2. ON-SCREEN TEXT is separate from the transcript, and in a dev reel it is usually where
  the real content lives: package names, commands, file paths, URLs, config and code shown
  in an editor or terminal. Capture it in reading order, character for character. Preserve
  exact casing, hyphens, slashes and file extensions — `next-auth` and `NextAuth` are not
  interchangeable, and a misread character makes the name unsearchable.

  3. KEY CLAIMS are the reusable assertions, each standing on its own without the video.
  Classify each honestly:
     - tactic  : a repeatable action ("colocate the server action with the component that calls it")
     - metric  : a number or result being asserted ("this cut the bundle by 60%")
     - opinion : a belief or preference stated as fact, with nothing to execute
     - tool    : a claim that a specific named product or library does something
     Set `verbatim` true only when `claim` is word-for-word from the video.
     Do not invent claims to fill the list. A reel with one real idea has one claim.

  4. REFERENCES are every distinct thing the reel points at by name. One entry each, and
  read these rules carefully because they are the point of this extraction:

     - `raw` is the name EXACTLY as it appeared or was said, copied character for
       character. Never tidy, expand, correct or canonicalise it here.
     - `name` is your best-effort canonical package or repository name for looking it up
       later, when you are confident of one. Leave it as an empty string when you are not.
       Guessing here produces a failed lookup, which is recoverable. Guessing in `raw`
       destroys the only evidence of what was actually shown, which is not.
     - `kind` is one of: repo, package, docs, tool, service, article, person, dataset,
       font, course, other.
     - `evidence` records where you got the name, and it decides how much later stages
       trust it:
         on_screen : the characters were legibly visible. The most reliable.
         caption   : it came from the post caption supplied below.
         spoken    : it was only ever said out loud. Phonetic and frequently wrong —
                     "chad CN", "zod", "bun" and "prisma" all sound like other things.
       When a name is both shown and spoken, record it as `on_screen`.
     - `note` is a short phrase on what it is FOR in this reel, so the entry is meaningful
       without the transcript. One line, no more.

  5. URLS_SEEN is for complete URLs that were literally visible on screen — in a browser
  address bar, a terminal, a slide, burned-in text. Copy them character for character.

     DO NOT PRODUCE URLS ANY OTHER WAY. Do not construct, complete, infer, correct or
     recall a URL for something named in the reel, however obvious it seems, and however
     confident you are that a project lives at a particular address. If the reel says
     "check out the repo" without showing the address, that is a reference with no URL, and
     that is the correct output. A fabricated link that returns 404 is worse than no link,
     because a reader cannot tell it was invented. Resolving names to real addresses is a
     later, verified step that is not your job.

  6. TAGS: choose 1-3 from this fixed vocabulary, by what the reel is *for*:
  {tag_block}

  7. HAS_USABLE_CONTENT is false when the reel is engagement bait, a pure advertisement for
  a course or bootcamp, or has no idea or reference a reader could act on or cite. When
  false, still fill in the other fields as best you can and include `low-signal` in tags.

  8. Never state anything the video does not support. Absent information is an empty string
  or an empty array, never a guess.

  Metadata about this reel, for your context only (do not restate it in the output):
  - creator handle: @{handle}
  - caption: {caption}
