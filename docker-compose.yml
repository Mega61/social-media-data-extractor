# Deployed as a Portainer stack. See RUNBOOK.md for the click-by-click.
#
# This pulls a prebuilt image from GHCR — the homelab does NOT build anything.
# To build locally instead:  docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Prerequisites — create BOTH volumes in the Portainer UI before first deploy:
#   Volumes → Add volume → name: sme_data     → Create the volume
#   Volumes → Add volume → name: sme_secrets  → Create the volume
#
# The vault lives at VAULT_DIR on the host (default /srv/reel-vault) so the
# markdown is directly readable. Set VAULT_UID/VAULT_GID to your own `id -u`/
# `id -g` so the notes are yours, not root's.
#
# /secrets is mounted read-write on purpose: it lets you refresh the Instagram
# cookie by sending cookies.txt to the Telegram bot, with no SSH and no redeploy.
name: sme

x-common: &common
  image: ${SME_IMAGE:-ghcr.io/mega61/social-media-data-extractor:main}
  pull_policy: always
  restart: unless-stopped
  environment:
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS}
    GEMINI_API_KEY: ${GEMINI_API_KEY}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    DEFAULT_PROFILE: ${DEFAULT_PROFILE:-marketing}
    AUTO_ROUTE: ${AUTO_ROUTE:-true}
    DOWNLOAD_MIN_INTERVAL_S: ${DOWNLOAD_MIN_INTERVAL_S:-90}
    DOWNLOAD_DAILY_CAP: ${DOWNLOAD_DAILY_CAP:-20}
    MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-30}
    MAX_ATTEMPTS: ${MAX_ATTEMPTS:-4}
    GIT_REMOTE: ${GIT_REMOTE:-}
    GIT_BRANCH: ${GIT_BRANCH:-main}
    GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-reel-bot}
    GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-reel-bot@localhost}
    DATA_DIR: /data
    COOKIES_PATH: /secrets/cookies.txt
    VAULT_UID: ${VAULT_UID:-}
    VAULT_GID: ${VAULT_GID:-}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    TZ: ${TZ:-UTC}
  volumes:
    - sme_data:/data
    - sme_secrets:/secrets
    # The vault is a plain host folder, not buried in a Docker volume, so you can
    # open it in Obsidian / a file manager / over SMB. Mounted over /data/vault;
    # queue.db and media/ stay in sme_data. Migrate BEFORE first use — see
    # RUNBOOK Part 11, or the existing notes get shadowed (not deleted).
    - ${VAULT_DIR:-/srv/reel-vault}:/data/vault
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Ingress only. Parses the share, writes a queue row, replies. Never blocks.
  bot:
    <<: *common
    container_name: sme-bot
    command: python -m sme.bot

  # Everything slow and everything that can fail.
  worker:
    <<: *common
    container_name: sme-worker
    command: python -m sme.worker

volumes:
  sme_data:
    external: true
    name: sme_data
  sme_secrets:
    external: true
    name: sme_secrets
